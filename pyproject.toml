[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-codex"
version = "0.1.0"
description = "A small autonomous coding agent powered by DeepSeek."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
minicodex = "minicodex.main:main"

[tool.pytest.ini_options]
testpaths = ["minicodex/tests"]
pythonpath = ["."]
addopts = "-p no:debugging --import-mode=prepend"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["minicodex*"]
