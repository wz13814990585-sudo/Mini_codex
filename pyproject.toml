[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-codex"
version = "0.1.0"
description = "A small autonomous coding agent powered by DeepSeek."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
minicodex = "minicodex.main:main"

[tool.pytest.ini_options]
testpaths = ["minicodex/tests"]
addopts = "-p no:debugging -p no:asyncio"

[tool.setuptools.packages.find]
include = ["minicodex*"]
