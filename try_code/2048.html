<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 小游戏</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: #faf8ef;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  .game { text-align: center; padding: 20px; }
  h1 { color: #776e65; font-size: 42px; margin-bottom: 8px; }
  .sub { color: #9c948a; font-size: 14px; margin-bottom: 16px; }
  .scores { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
  .score-box {
    background: #bbada0; color: #eee4da; border-radius: 6px;
    padding: 6px 18px; min-width: 90px;
  }
  .score-box .label { font-size: 12px; text-transform: uppercase; }
  .score-box .value { font-size: 22px; font-weight: bold; color: #fff; }
  #msg {
    height: 22px; margin-bottom: 8px; font-size: 16px; font-weight: bold; color: #f65e3b;
  }
  #board {
    width: 380px; height: 380px; margin: 0 auto;
    background: #bbada0; border-radius: 8px; padding: 8px;
    display: grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr); gap: 8px; touch-action: none;
  }
  .cell {
    background: #cdc1b4; border-radius: 6px;
    display: flex; justify-content: center; align-items: center;
    font-size: 40px; font-weight: bold; color: #776e65;
    transition: background 0.12s ease;
  }
  .tile-2    { background:#eee4da; }
  .tile-4    { background:#ede0c8; }
  .tile-8    { background:#f2b179; color:#f9f6f2; }
  .tile-16   { background:#f59563; color:#f9f6f2; }
  .tile-32   { background:#f67c5f; color:#f9f6f2; }
  .tile-64   { background:#f65e3b; color:#f9f6f2; }
  .tile-128  { background:#edcf72; color:#f9f6f2; font-size:34px; }
  .tile-256  { background:#edcc61; color:#f9f6f2; font-size:34px; }
  .tile-512  { background:#edc850; color:#f9f6f2; font-size:34px; }
  .tile-1024 { background:#edc53f; color:#f9f6f2; font-size:28px; }
  .tile-2048 { background:#edc22e; color:#f9f6f2; font-size:28px;
               box-shadow: 0 0 24px rgba(243,215,116,0.5); }
  #restart {
    margin-top: 18px; padding: 10px 30px; font-size: 16px;
    background: #8f7a66; color: #f9f6f2; border: none; border-radius: 6px;
    cursor: pointer;
  }
  #restart:hover { background: #7f6a56; }
  .controls { margin-top: 10px; font-size: 13px; color: #9c948a; }
  @media (max-width: 440px) {
    #board { width: 92vw; height: 92vw; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="game">
  <h1>2048</h1>
  <div class="sub">合并方块，挑战 2048！</div>
  <div class="scores">
    <div class="score-box"><div class="label">分数</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">最高</div><div class="value" id="best">0</div></div>
  </div>
  <div id="msg"></div>
  <div id="board"></div>
  <button id="restart">重新开始</button>
  <div class="controls">使用方向键 / WASD / 滑动屏幕进行操作</div>
</div>
<script>
(function () {
  "use strict";
  var SIZE = 4;
  var boardEl = document.getElementById("board");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var msgEl = document.getElementById("msg");
  var restartBtn = document.getElementById("restart");

  var grid = [];
  var score = 0;
  var best = parseInt(localStorage.getItem("2048_best") || "0", 10) || 0;
  var won = false;
  var over = false;
  var tiles = [];

  function emptyCells() {
    var list = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) list.push({ r: r, c: c });
      }
    }
    return list;
  }

  function spawnTile() {
    var empties = emptyCells();
    if (empties.length === 0) return;
    var cell = empties[Math.floor(Math.random() * empties.length)];
    grid[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
  }

  function updateBest() {
    if (score > best) {
      best = score;
      localStorage.setItem("2048_best", String(best));
    }
  }

  function hasMoves() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = grid[r][c];
        if (v === 0) return true;
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  // dir: -1 = up (decreasing row index), 1 = down, cdir for columns handled by transpose
  function slideLine(line) {
    // Remove zeros then merge adjacent equal tiles toward the start of `line`
    var out = [];
    for (var i = 0; i < line.length; i++) {
      if (line[i] !== 0) out.push(line[i]);
    }
    var merged = [];
    var gained = 0;
    for (var j = 0; j < out.length; j++) {
      if (j + 1 < out.length && out[j] === out[j + 1]) {
        merged.push(out[j] * 2);
        gained += out[j] * 2;
        j++;
      } else {
        merged.push(out[j]);
      }
    }
    while (merged.length < SIZE) merged.push(0);
    return { line: merged, gained: gained };
  }

  // Extract a line in movement direction and write back
  function moveLine(direction) {
    var gained = 0;
    var moved = false;
    for (var i = 0; i < SIZE; i++) {
      var line = [];
      for (var k = 0; k < SIZE; k++) {
        var r, c;
        if (direction === "left") { r = i; c = k; }
        else if (direction === "right") { r = i; c = SIZE - 1 - k; }
        else if (direction === "up") { r = k; c = i; }
        else { r = SIZE - 1 - k; c = i; } // down
        line.push(grid[r][c]);
      }
      var result = slideLine(line);
      gained += result.gained;
      for (var k2 = 0; k2 < SIZE; k2++) {
        var r2, c2;
        if (direction === "left") { r2 = i; c2 = k2; }
        else if (direction === "right") { r2 = i; c2 = SIZE - 1 - k2; }
        else if (direction === "up") { r2 = k2; c2 = i; }
        else { r2 = SIZE - 1 - k2; c2 = i; }
        if (grid[r2][c2] !== result.line[k2]) moved = true;
        grid[r2][c2] = result.line[k2];
      }
    }
    return { gained: gained, moved: moved };
  }

  function render() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    // Reuse existing tiles, create as needed
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var idx = r * SIZE + c;
        var el = tiles[idx];
        if (!el) {
          el = document.createElement("div");
          el.className = "cell";
          boardEl.appendChild(el);
          tiles[idx] = el;
        }
        var val = grid[r][c];
        el.textContent = val === 0 ? "" : val;
        el.className = "cell" + (val !== 0 ? " tile-" + val : "");
      }
    }
  }

  function checkEnd() {
    var maxVal = 0;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (grid[r][c] > maxVal) maxVal = grid[r][c];
      }
    }
    if (!won && maxVal >= 2048) {
      won = true;
      msgEl.textContent = "恭喜！你拼出了 2048！🎉";
    } else if (!over && !hasMoves()) {
      over = true;
      msgEl.textContent = "游戏结束！点击重新开始再来一局。";
    }
  }

  function doMove(direction) {
    if (over) return;
    var before = grid.map(function (row) { return row.slice(); });
    var result = moveLine(direction);
    if (!result.moved) return;
    score += result.gained;
    updateBest();
    spawnTile();
    render();
    checkEnd();
  }

  function reset() {
    grid = [];
    for (var r = 0; r < SIZE; r++) {
      grid.push([0, 0, 0, 0]);
    }
    score = 0;
    won = false;
    over = false;
    msgEl.textContent = "";
    spawnTile();
    spawnTile();
    render();
  }

  // Keyboard: arrows + WASD
  document.addEventListener("keydown", function (e) {
    var key = e.key.toLowerCase();
    if (["arrowup", "w"].indexOf(key) !== -1) { e.preventDefault(); doMove("up"); }
    else if (["arrowdown", "s"].indexOf(key) !== -1) { e.preventDefault(); doMove("down"); }
    else if (["arrowleft", "a"].indexOf(key) !== -1) { e.preventDefault(); doMove("left"); }
    else if (["arrowright", "d"].indexOf(key) !== -1) { e.preventDefault(); doMove("right"); }
  });

  // Touch / swipe support
  var startX = 0, startY = 0, tracking = false;
  boardEl.addEventListener("touchstart", function (e) {
    var t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    tracking = true;
    e.preventDefault();
  }, { passive: false });
  boardEl.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  boardEl.addEventListener("touchend", function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      doMove(dx > 0 ? "right" : "left");
    } else {
      doMove(dy > 0 ? "down" : "up");
    }
  });

  restartBtn.addEventListener("click", reset);

  bestEl.textContent = best;
  reset();
})();
</script>
</body>
</html>
